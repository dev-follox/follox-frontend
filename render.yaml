services:
  - type: web
    name: deltahub-frontend
    env: static
    envVars:
      - key: VITE_API_URL
        value: https://api.follox.co
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
